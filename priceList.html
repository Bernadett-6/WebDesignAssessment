<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricelist</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bacasime+Antique&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="pricelistPage">

    <div class="container">
      <div class="row">

        <div class="col-md-6">
          <div class="px-4 border rounded mx-2 my-5" style="max-width: 700px">
            <h2 class="p-4 priceListheading">Pricelist</h2>

            <div class="mb-5 itemPrice">
              <span>Acrylic</span>
              <span class="dots"></span>
              <span class="price">€60</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>Gel</span>
              <span class="dots"></span>
              <span class="price">€60</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>BIAB</span>
              <span class="dots"></span>
              <span class="price">€50</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>Shellac</span>
              <span class="dots"></span>
              <span class="price">€35</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>Mini Pedicure</span>
              <span class="dots"></span>
              <span class="price">€40</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>Full Pedicure</span>
              <span class="dots"></span>
              <span class="price">€50</span>
            </div>

          </div>
        </div>

        <div class="col-md-6">
          <div class="p-4 border rounded mx-2 my-5" style="max-width: 700px">
            <h2 class="p-4 addOnheading">Add ons</h2>

            <div class="mb-5 itemPrice">
              <span>French</span>
              <span class="dots"></span>
              <span class="price">€7</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>Simple Nail Art</span>
              <span class="dots"></span>
              <span class="price">€5</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>Detailed Nail Art</span>
              <span class="dots"></span>
              <span class="price">€10</span>
            </div>

            <div class="mb-5 itemPrice">
              <span>Chrome</span>
              <span class="dots"></span>
              <span class="price">€5</span>
            </div>
            
          </div>
        </div>

      </div>
    </div>

  </body>
</html>
