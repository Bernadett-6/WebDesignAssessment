<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Now</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bacasime+Antique&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <form
      action="#"
      method="post"
      class="p-4 border rounded mt-4 mx-auto"
      style="max-width: 700px"
    >
      <fieldset class="form-group">
        <legend class="p-2">Book your Appointment</legend>

        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            class="form-control"
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="surname" class="form-label">Surname</label>
          <input
            class="form-control"
            type="text"
            id="surname"
            name="surname"
            placeholder="Enter your surname"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
          />
        </div>

        <div class="mb-3">
          <label for="date" class="form-label">Appointment Date</label>
          <input
            class="form-control"
            type="date"
            id="date"
            name="date"
            required
          />
        </div>

        <div class="mb-3">
          <label for="time" class="form-label">Appointment Time</label>
          <select class="form-control" id="time" name="time" required>
            <option value="">Select a time</option>
            <option value="09:00">09:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="12:00">12:00 PM</option>
            <option value="13:00">01:00 PM</option>
            <option value="14:00">02:00 PM</option>
            <option value="15:00">03:00 PM</option>
            <option value="16:00">04:00 PM</option>
            <option value="17:00">05:00 PM</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="service" class="form-label">Nail Service</label>
          <select class="form-control" id="service" name="service" required>
            <option value="">Select a service</option>
            <option value="acrylic">Acrylic</option>
            <option value="biab">BIAB</option>
            <option value="gel">Gel</option>
            <option value="shellac">Shellac</option>
          </select>
        </div>
      </fieldset>

      <button type="submit" class="formButton">Book Appointment</button>
    </form>
  </body>
</html>
